services:
  postgres:
    image: postgres:17-alpine
    container_name: buddybird-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buddybird}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buddybird}
      POSTGRES_DB: ${POSTGRES_DB:-buddybird}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buddybird} -d ${POSTGRES_DB:-buddybird}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: buddybird-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
