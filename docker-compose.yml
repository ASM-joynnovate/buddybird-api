services:
  api:
    build: .
    image: buddybird-api
    profiles: [app]
    env_file: .env.local
    environment:
      ENV: local
      DB_HOST: postgres
      REDIS_HOST: redis
      SQS_ENDPOINT_URL: http://elasticmq:9324
      SQS_UPLOAD_CONFIRMATION_QUEUE_URL: http://elasticmq:9324/000000000000/upload-confirmation
      SQS_NOTIFICATION_QUEUE_URL: http://elasticmq:9324/000000000000/notification
      SQS_WITHDRAWAL_QUEUE_URL: http://elasticmq:9324/000000000000/withdrawal
      SQS_PERIODIC_COMMAND_QUEUE_URL: http://elasticmq:9324/000000000000/periodic-command
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticmq:
        condition: service_started

  worker:
    build: .
    image: buddybird-api
    profiles: [app]
    env_file: .env.local
    environment:
      ENV: local
      DB_HOST: postgres
      REDIS_HOST: redis
    command: [celery, -A, "app.tasks:celery", worker, --pool=prefork, --concurrency=1, --loglevel=INFO]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    image: buddybird-api
    container_name: buddybird-beat
    profiles: [app]
    env_file: .env.local
    environment:
      ENV: local
      DB_HOST: postgres
      REDIS_HOST: redis
    command: [celery, -A, "app.tasks:celery", beat, --loglevel=INFO, --schedule=/tmp/buddybird-celerybeat]
    depends_on:
      redis:
        condition: service_healthy

  consumer:
    build: .
    image: buddybird-api
    profiles: [app]
    env_file: .env.local
    environment:
      ENV: local
      DB_HOST: postgres
      SQS_ENDPOINT_URL: http://elasticmq:9324
      SQS_UPLOAD_CONFIRMATION_QUEUE_URL: http://elasticmq:9324/000000000000/upload-confirmation
      SQS_NOTIFICATION_QUEUE_URL: http://elasticmq:9324/000000000000/notification
      SQS_WITHDRAWAL_QUEUE_URL: http://elasticmq:9324/000000000000/withdrawal
      SQS_PERIODIC_COMMAND_QUEUE_URL: http://elasticmq:9324/000000000000/periodic-command
    command: [python, -m, app.consumer]
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: buddybird-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buddybird}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buddybird}
      POSTGRES_DB: ${POSTGRES_DB:-buddybird}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buddybird} -d ${POSTGRES_DB:-buddybird}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: buddybird-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticmq:
    image: softwaremill/elasticmq-native
    container_name: buddybird-elasticmq
    ports:
      - "9324:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  postgres-data:
  redis-data:
