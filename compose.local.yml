services:
  api:
    build: .
    image: buddybird-api
    profiles: [app]
    env_file: .env.local
    environment:
      ENV: local
      DB_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  queues:
    build: .
    image: buddybird-api
    profiles: [app]
    env_file: .env.local
    environment:
      ENV: local
    network_mode: service:api
    volumes:
      - ./local:/app/local:ro
    command: [python, -m, local.queues]
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: buddybird-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buddybird}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buddybird}
      POSTGRES_DB: ${POSTGRES_DB:-buddybird}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buddybird} -d ${POSTGRES_DB:-buddybird}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
