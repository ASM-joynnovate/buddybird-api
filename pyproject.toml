[project]
name = "buddybird-api"
version = "0.1.0"
description = "버디버드 API Backend"
requires-python = ">=3.14"
dependencies = [
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.63",
    "dependency-injector>=4.49.1",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.4",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-distro>=0.64b0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "opentelemetry-instrumentation-redis>=0.64b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
    "opentelemetry-sdk>=1.44.0",
    "orjson>=3.11.9",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-magic>=0.4.27",
    "redis>=8.1.0",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy>=2.0.51",
    "starlette>=1.3.1",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest-mock>=3.14.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.25.3",
    "alembic>=1.18.5",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "ERA",
    "F",
    "FAST",
    "FURB",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "E111",
    "E114",
    "E117",
    "TRY003",
    "W191",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.model_validator", "pydantic.field_validator"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["N999", "ERA001", "E501"]
"tests/**" = ["S101", "ARG", "PLR2004"]
"__init__.py" = ["F401"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true
