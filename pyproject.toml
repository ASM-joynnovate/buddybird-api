[project]
name = "buddybird-api"
version = "1.0.0"
description = "버디버드 API Backend"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.31.0",
    "boto3>=1.43.93",
    "cryptography>=46.0.0",
    "fastapi[standard]>=0.141.1",
    "firebase-admin>=7.6.0",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.83",
    "mypy-boto3-s3>=1.43.83",
    "pytest-mock>=3.14.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4
force-exclude = true
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "ERA",
    "F",
    "FAST",
    "FURB",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "TRY003",
    "W191",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.field_validator"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["N999", "ERA001", "E501"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true
