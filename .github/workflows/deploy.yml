name: deploy

on:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency: deploy-${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      WORKER_NAME: jn-buddybird-api-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      IMAGE_REPOSITORY: registry.cloudflare.com/0c4453da6d81adec04df8132e00660c4/jn-buddybird-api
      HEALTH_URL: https://${{ github.ref_name == 'main' && 'buddybird.xyz' || 'dev.buddybird.xyz' }}/api/healthz
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CLOUDFLARE_ACCOUNT_ID: 0c4453da6d81adec04df8132e00660c4
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: read version
        id: version
        run: |
          echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: notify deploy start
        uses: ./.github/actions/notify-slack
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: 🚀 ${{ env.WORKER_NAME }} 배포 시작
          fields: |
            환경=${{ env.ENVIRONMENT }}
            버전=${{ steps.version.outputs.version }}
            실행자=${{ github.actor }}
            트리거=${{ github.event_name }} to ${{ github.ref_name }}
          buttons: |
            실행 로그=${{ env.RUN_URL }}
            변경 내역=${{ github.event.compare }}
          commit-range: ${{ github.event.before }}..${{ github.sha }}

      - name: install wrangler
        id: wrangler
        working-directory: worker
        run: npm ci

      - name: login to registry
        id: registry
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          credentials=$(npx wrangler containers registries credentials --pull --json)
          jq -r .password <<< "$credentials" | docker login --password-stdin --username "$(jq -r .username <<< "$credentials")" registry.cloudflare.com

      - name: resolve image uri
        id: image
        run: echo "uri=$IMAGE_REPOSITORY:${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: ensure version is not in registry
        id: check-new-version
        if: github.ref_name == 'dev'
        run: "! docker manifest inspect ${{ steps.image.outputs.uri }}"

      - name: ensure version is in registry
        id: check-image-exists
        if: github.ref_name == 'main'
        run: docker manifest inspect ${{ steps.image.outputs.uri }}

      - name: build and push image
        id: build
        if: github.ref_name == 'dev'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler containers build .. --tag "jn-buddybird-api:${{ steps.version.outputs.version }}" --push

      - name: resolve image digest
        id: digest
        run: |
          digest=$(docker manifest inspect -v ${{ steps.image.outputs.uri }} | jq -er .Descriptor.digest)
          echo "uri=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: deploy worker
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/deploy.ndjson
        run: |
          jq --arg env "$ENVIRONMENT" --arg image "${{ steps.digest.outputs.uri }}" '.env[$env].containers[0].images.api = {image: $image}' wrangler.jsonc > wrangler.json
          mv wrangler.json wrangler.jsonc
          npx wrangler deploy --env "$ENVIRONMENT"
          version=$(jq -er 'select(.type == "deploy").version_id' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: verify deployment
        id: verify
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          reached=false
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            response=$(curl -sS --max-time 300 -o /dev/null -D - -w '%{http_code}' "$HEALTH_URL" | tr -d '\r' || true)
            version=$(grep -i '^x-container-version:' <<< "$response" | tr -d - || true)
            case "${response##*$'\n'} $version" in
              "200 "*"${VERSION//-/}"*) exit 0 ;;
              *" "?*) reached=true ;;
            esac
            sleep 5
          done
          if [ "$reached" = true ]; then
            npx wrangler rollback --env "$ENVIRONMENT" --message "deploy ${{ steps.version.outputs.version }} failed"
          fi
          exit 1

      - name: collect result
        id: result
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          STARTED: ${{ steps.version.outputs.started }}
        run: |
          echo "failed_step=$(jq -r '[to_entries[] | select(.value.conclusion == "failure") | .key][0] // ""' <<< "$STEPS")" >> "$GITHUB_OUTPUT"
          elapsed=$(( $(date +%s) - STARTED ))
          echo "duration=$(( elapsed / 60 ))m $(( elapsed % 60 ))s" >> "$GITHUB_OUTPUT"

      - name: notify deploy result
        if: always()
        uses: ./.github/actions/notify-slack
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: "${{ job.status == 'success' && '✅' || job.status == 'failure' && '❌' || '⚠️' }} ${{ env.WORKER_NAME }} 배포 ${{ job.status == 'success' && '성공' || job.status == 'failure' && '실패' || '취소' }}"
          fields: |
            환경=${{ env.ENVIRONMENT }}
            버전=${{ steps.version.outputs.version }}
            실행자=${{ github.actor }}
            트리거=${{ github.event_name }} to ${{ github.ref_name }}
            소요 시간=${{ steps.result.outputs.duration }}
            실패 step=${{ steps.result.outputs.failed_step }}
          buttons: |
            실행 로그=${{ env.RUN_URL }}
            변경 내역=${{ github.event.compare }}
          commit-range: ${{ github.event.before }}..${{ github.sha }}
